services:
  postgres:
    image: postgres:17
    container_name: ems_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ems_app
    container_name: ems_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override DB connection so the app reaches postgres over the
      # compose network instead of 127.0.0.1 from the .env file.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - ${APP_PORT:-3000}:3000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
